plugins {
    id 'maven-publish'
}

def unobfuscated = project.minecraft_version.startsWith("26.")
if (unobfuscated) {
    apply plugin: 'net.fabricmc.fabric-loom'
} else {
    apply plugin: 'net.fabricmc.fabric-loom-remap'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    // 自动分离客户端和通用代码
    splitEnvironmentSourceSets()

    // 生成 IDE 运行配置并设置共享目录
    runConfigs.all {
        ideConfigGenerated true
        runDir "./run"
    }
}

repositories {
    maven { url 'https://masa.dy.fi/maven' }
    maven { url "https://api.modrinth.com/maven" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    
    if (!unobfuscated) {
        if (project.yarn_mappings != "") {
            mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
        } else {
            mappings loom.officialMojangMappings()
        }
    }
    
    def modImpl = unobfuscated ? "implementation" : "modImplementation"

    "${modImpl}" "net.fabricmc:fabric-loader:${project.loader_version}"
    "${modImpl}" "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    if (unobfuscated) {
        "${modImpl}" "carpet:fabric-carpet:${project.carpet_core_version}"
    } else {
        "${modImpl}" "maven.modrinth:carpet:${project.carpet_core_version}"
    }
    }

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "minecraft_dependency", project.minecraft_dependency
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("*.mixins.json") {
        if (project.minecraft_version.startsWith("26.")) {
            filter { String line ->
                line.contains("BlockPosMixin") || line.contains("EntityAccessor") || line.contains("ProjectileEntityMixin") || line.contains("ServerWorldMixin") ? null : line
            }
        }
    }

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "minecraft_dependency": project.minecraft_dependency,
                "loader_version": project.loader_version,
                "carpet_core_version": project.carpet_core_version
    }
}

def targetJavaVersion = project.minecraft_version.startsWith("26.") ? 25 : 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
    repositories {
    }
}

